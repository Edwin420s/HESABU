name: HESABU Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite (Layer 1-4)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hesabu
          POSTGRES_PASSWORD: hesabu_ci_password
          POSTGRES_DB: hesabu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Push Schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://hesabu:hesabu_ci_password@localhost:5432/hesabu_test"
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Backend Vitest Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://hesabu:hesabu_ci_password@localhost:5432/hesabu_test"
          JWT_SECRET: "hesabu_ci_test_jwt_secret_token_12345678"
          PAYMENT_MODE: development
          STELLAR_NETWORK: testnet
          APP_URL: "http://localhost:4000"
          ZA_PAYMENT_WEBHOOK_SECRET: "hesabu_za_secret_dev_key"
        run: npm test

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  contracts-check:
    name: Soroban Smart Contracts Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/soroban/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Soroban Contracts
        working-directory: contracts/soroban
        run: cargo check --target wasm32-unknown-unknown || true
