version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hesabu-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hesabu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be explicitly provided in production}
      POSTGRES_DB: ${POSTGRES_DB:-hesabu_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - hesabu-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hesabu} -d ${POSTGRES_DB:-hesabu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesabu-api-prod
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      PAYMENT_MODE: live
      DATABASE_URL: postgresql://${POSTGRES_USER:-hesabu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hesabu_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be explicitly provided in production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Error: CORS_ORIGIN must be explicitly configured in production}
      APP_URL: ${APP_URL:-https://api.hesabu.co}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-public}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon.stellar.org}
      ZA_PAYMENT_WEBHOOK_SECRET: ${ZA_PAYMENT_WEBHOOK_SECRET:?Error: ZA_PAYMENT_WEBHOOK_SECRET is mandatory in production}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hesabu-internal
      - hesabu-public
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hesabu-frontend-prod
    restart: always
    depends_on:
      - api
    networks:
      - hesabu-public
    ports:
      - "80:80"
      - "443:443"

networks:
  hesabu-internal:
    driver: bridge
  hesabu-public:
    driver: bridge

volumes:
  pgdata_prod:
